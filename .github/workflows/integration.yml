name: Queue and sandbox integration
on: [push, pull_request, workflow_dispatch]
jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      redis:
        image: redis:7.2-alpine
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
        options: --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
      MONGODB_URI: mongodb://127.0.0.1:27017/compileit_ci_test
      EXECUTION_MODE: docker
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run runner:build
      - run: npm run test:docker
      - run: npm run test:recovery
      - run: npm run test:redis
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-verification
          path: docs/verification/*.json
